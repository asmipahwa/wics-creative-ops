name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: No secrets or personal data in the repo
        run: |
          ! git grep -nIE '(asana|token)[^\n]{0,20}[=:][[:space:]]*["'"'"']?[0-9]/[0-9]{10,}|@gmail\.com|@sfu\.ca' -- . ':!package-lock.json' ':!.github/workflows/ci.yml'
